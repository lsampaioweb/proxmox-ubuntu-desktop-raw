---
- name: "Testing netplan configuration - Ubuntu Server simulation"
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: "Creating Ubuntu Server style netplan file (systemd-networkd)"
      ansible.builtin.copy:
        content: |
          # This file is generated from information provided by the datasource.  Changes
          # to it will not persist across an instance reboot.  To disable cloud-init's
          # network configuration capabilities, write a file
          # /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg with the following:
          # network: {config: disabled}
          network:
            version: 2
            ethernets:
              eth0:
                dhcp4: true
                match:
                  macaddress: 6e:4c:7c:0b:7d:79
                set-name: eth0
        dest: "/tmp/server-netplan.yaml"
        mode: "0644"

    - name: "Showing original server netplan"
      ansible.builtin.command: cat /tmp/server-netplan.yaml
      changed_when: false
      register: original

    - name: "Displaying original content"
      ansible.builtin.debug:
        msg: "=== ORIGINAL SERVER NETPLAN ==="

    - name: "Displaying original lines"
      ansible.builtin.debug:
        var: original.stdout_lines

    - name: "Testing NetworkManager check task"
      ansible.builtin.lineinfile:
        path: "/tmp/server-netplan.yaml"
        regexp: "^\\s+renderer:\\s+NetworkManager"
        state: "absent"
      check_mode: true
      register: "nm_check"

    - name: "Showing check result"
      ansible.builtin.debug:
        msg: "NetworkManager check changed: {{ nm_check.changed }} (should be True for server)"

    - name: "Testing the NetworkManager insertion task"
      when: nm_check.changed
      ansible.builtin.lineinfile:
        path: "/tmp/server-netplan.yaml"
        insertbefore: "^\\s+version:"
        regexp: "^\\s+renderer:"
        line: "    renderer: NetworkManager"
        state: "present"

    - name: "Showing result after modification"
      ansible.builtin.command: cat /tmp/server-netplan.yaml
      changed_when: false
      register: result

    - name: "Displaying modified content"
      ansible.builtin.debug:
        msg: "=== AFTER NETWORKMANAGER INSERTION ==="

    - name: "Displaying modified lines"
      ansible.builtin.debug:
        var: result.stdout_lines

    - name: "Testing YAML validity with Python"
      ansible.builtin.shell: >-
        set -o pipefail && \
        cat /tmp/server-netplan.yaml | python3 -c "import sys; import yaml; print('YAML is valid'); yaml.safe_load(sys.stdin)"
      args:
        executable: "/usr/bin/bash"
      changed_when: false
      ignore_errors: true
      register: "yaml_test"

    - name: "Showing YAML validation result"
      ansible.builtin.debug:
        var: yaml_test
